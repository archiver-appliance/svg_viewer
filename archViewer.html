<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPICS Archiver Appliance</title>


<link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="node_modules/eonasdan-bootstrap-datetimepicker/build/css/bootstrap-datetimepicker.css" rel="stylesheet">

<link href="css/noty_3.1.4.css" rel="stylesheet">
<link href="css/archiver.css" rel="stylesheet">


<script src="node_modules/lodash/lodash.min.js"></script>
<script src="node_modules/plotly.js-dist-min/plotly.min.js"></script>
<script src="node_modules/jquery/dist/jquery.min.js"></script>
<script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
<script src="node_modules/moment/moment.js"></script>
<script src="node_modules/eonasdan-bootstrap-datetimepicker/build/js/bootstrap-datetimepicker.min.js"></script>
<script src="node_modules/mustache/mustache.min.js"></script>
<script src="node_modules/noty/lib/noty.min.js"></script>

</head>
<body>

<div id="wrapper" ondrop="drop(event)" ondragover="allowDrop(event)">






<div id="appContainer">

<div id="pvSidebar">
    <div class="sidebar-header">
        <div class="sidebar-title">PVs</div>
        <input
            id="pvSidebarSearch"
            class="sidebar-search"
            type="text"
            placeholder="Search…"
            autocomplete="off"
            spellcheck="false"
        />
        <button id="pvSidebarToggle" title="Unpin sidebar" data-icon="pin"></button>
    </div>
    <div class="sidebar-status" id="pvSidebarStatus"></div>
    <div class="sidebar-list" id="pvSidebarList"></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section-header">
        <span class="sidebar-section-title">On Plot</span>
        <span class="sidebar-section-count" id="pvSelectedCount"></span>
    </div>
    <div class="sidebar-list" id="pvSelectedList"></div>
    <div class="sidebar-selected-actions" id="pvSelectedActions">
        <button id="pvSelectAll"   class="sidebar-action-btn" disabled>Select All</button>
        <button id="pvUnselectAll" class="sidebar-action-btn" disabled>Unselect All</button>
        <button id="pvRemove"      class="sidebar-action-btn sidebar-action-btn-danger" disabled>Remove</button>
    </div>
</div>

<div id="mainPanel">
<div id="dateRangeBar">
        <span class="date-range-label">Start</span>
        <div class="input-group date" id="startTime">
            <input id="dialog_startTime" type="text" class="date-range-input" autocomplete="off" spellcheck="false"/>
            <span class="input-group-addon date-range-icon">
                <span class="glyphicon glyphicon-calendar"></span>
            </span>
        </div>
        <span class="date-range-label">End</span>
        <div class="input-group date" id="endTime">
            <input id="dialog_endTime" type="text" class="date-range-input" autocomplete="off" spellcheck="false"/>
            <span class="input-group-addon date-range-icon">
                <span class="glyphicon glyphicon-calendar"></span>
            </span>
        </div>
        <div id="rangeButtons"></div>
        <div id="liveControls">
            <input id="timeInput" type="number" min="1" value="7" class="live-interval-input" disabled />
            <select id="unitInput" class="live-unit-select" disabled>
                <option value="second">second(s)</option>
                <option value="minute" selected>minute(s)</option>
                <option value="hour">hour(s)</option>
                <option value="day">day(s)</option>
            </select>
        </div>
        <div id="chartTools">
            <button class="action-btn" id="toolPan" title="Pan" data-icon="pan"></button>
            <button class="action-btn active" id="toolZoom" title="Zoom" data-icon="zoom"></button>
            <button class="action-btn" id="toolZoomIn" title="Zoom in" data-icon="zoom-in"></button>
            <button class="action-btn" id="toolZoomOut" title="Zoom out" data-icon="zoom-out"></button>
            <button class="action-btn" id="toolReset" title="Autoscale / Reset axes" data-icon="reset"></button>
            <button class="action-btn" id="actionYAxes" title="Specify ranges for the Y axes" data-icon="y-axes"></button>
            <button class="action-btn" id="actionFullscreen" title="Fullscreen" data-icon="fullscreen"></button>
        </div>
        <div id="actionButtons">
            <button class="action-btn" id="toolSavePng" title="Export plot as a PNG" data-icon="camera"></button>
            <button class="action-btn" id="actionExportCSV" title="Export data as a CSV" data-icon="download"></button>
            <button class="action-btn" id="actionLink" title="Copy link to current view to clipboard" data-icon="link"></button>
            <button class="action-btn" id="actionElog" title="Post to elog" style="display:none" data-icon="upload"></button>
        </div>
        <button id="dateRangeBarToggle" title="Unpin top bar" data-icon="pin"></button>
        <script type="text/javascript">
            $(function () {
                function fixDatepickerPosition($component) {
                    // The library positions using .position() (relative to offset parent),
                    // but the widget lives in body and needs .offset() (document-absolute).
                    // Use setTimeout to run after the library's own I() call finishes.
                    setTimeout(function () {
                        var $widget = $('.bootstrap-datetimepicker-widget:visible');
                        if (!$widget.length) return;
                        var off = $component.offset();
                        $widget.css({
                            top:  off.top + $component.outerHeight(),
                            left: off.left
                        });
                    }, 0);
                }
                $('#startTime').datetimepicker({format: "YYYY/MM/DD HH:mm:ss", widgetParent: 'body'});
                $('#endTime').datetimepicker({format: "YYYY/MM/DD HH:mm:ss", widgetParent: 'body'});
                $('#startTime').on('dp.show', function () { fixDatepickerPosition($(this)); });
                $('#endTime').on('dp.show', function () { fixDatepickerPosition($(this)); });
                $('#startTime').on('dp.change', startAndEndTimeSelected);
                $('#endTime').on('dp.change', startAndEndTimeSelected);
                $('#dialog_startTime').keydown(function(e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        startAndEndTimeSelected();
                    }
                });
                $('#dialog_endTime').keydown(function(e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        startAndEndTimeSelected();
                    }
                });
                renderRangeButtons();
                $('#unitInput').on('change', showAdvancedView);
                $('#timeInput').on('change', showAdvancedView);
                $('#timeInput').on('blur', function() {
                    if (!this.value || parseInt(this.value) < 1) this.value = 1;
                    showAdvancedView();
                });
                $('#timeInput').keydown(function(e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        if (!this.value || parseInt(this.value) < 1) this.value = 1;
                        showAdvancedView();
                    }
                });
                document.getElementById('actionExportCSV').addEventListener('click', exportToCSV);
                document.getElementById('actionLink').addEventListener('click', copyLinkToClipboard);
                document.getElementById('actionYAxes').addEventListener('click', showYAxesRangeModal);
                document.getElementById('actionFullscreen').addEventListener('click', toggleFullscreen);
                document.getElementById('actionElog').addEventListener('click', showElogModal);
                document.querySelectorAll('[data-icon]').forEach(function(btn) {
                    fetch('icons/' + btn.dataset.icon + '.svg')
                        .then(function(r) { return r.text(); })
                        .then(function(svg) { btn.innerHTML = svg; });
                });
            });
        </script>
    </div>
    <div id="archViewer"></div>
</div>

</div>


</div>

<!--  Choose bin size  -->
<div id="binSizeModal" class="modal fade" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                       <span aria-hidden="true">&times;</span>
                       <span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="myModalLabel">
                    Choose a bin size (in seconds):
                </h4>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <form class="form-horizontal" role="form">
                  <div class="form-group">
                  	<div class='input-group'>
                	  <span class="input-group-addon">Bin Size(s):</span>
                      <input type="text" class="form-control" id="binSizeInput" placeholder="300"/>
                      </div>
                  </div>
                </form>
                <div class="modal-footer">
        			<button type="button" class="btn btn-default" data-dismiss="modal">Done</button>
      			</div>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        $(function () {
            $('#binSizeModal').on('hidden.bs.modal', fixBinSize);
            $("#binSizeInput").keydown(function(e) {
                if (e.keyCode == 13) {
                    e.preventDefault();
                    $("#binSizeModal").modal("hide");
                    fixBinSize();
                }
            });
        });
    </script>
</div>





<!--  Comment for elog  -->
<div id="elogModal" class="modal fade" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                       <span aria-hidden="true">&times;</span>
                       <span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="myModalLabel">
                    Post to the elog:
                </h4>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <form class="form-horizontal" role="form">
                  <div class="form-group"><textarea rows="5" class="form-control" id="elogComment" placeholder="Please add a comment for the eLog" ></textarea></div>
                </form>
                <div class="modal-footer">
        			<button type="button" class="btn btn-default" data-dismiss="modal" id="elogPost">Post</button>
      			</div>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        $(function () {
            $('#elogPost').on('click', postToELog);
        });
    </script>
</div>

<!--  Ranges for the Y-Axes  -->
<div id="yAxesModal" class="modal fade" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                       <span aria-hidden="true">&times;</span>
                       <span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="myModalLabel">
                    Specify ranges for the Y Axes based on EGU's:
                </h4>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <form class="form-horizontal" role="form">
                    <table class="table table-striped table-bordered">
                        <thead><tr><th>EGU</th><th>Min</th><th>Max</th></tr></thead>
                        <tbody>

                        </tbody>
                    </table>
                </form>
                <div class="modal-footer">
        			<button type="button" class="btn btn-default" data-dismiss="modal" id="yAxesPost">Set Ranges</button>
      			</div>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        $(function () {
            $('#yAxesPost').on('click', applyYAxesRanges);
        });
    </script>
</div>

<!--  remove PVs  -->
<div id="removePVsModal" class="modal fade" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                       <span aria-hidden="true">&times;</span>
                       <span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="myModalLabel">
                    Remove selected PVs
                </h4>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <form class="form-horizontal" role="form">
                    <div class="checkboxlist">
                    </div>
                </form>
            </div>
             <div class="modal-footer">
     			<button type="button" class="btn btn-default" data-dismiss="modal" id="removePVsBtn">Remove</button>
   			</div>
        </div>
    </div>
    <script type="text/javascript">
        $(function () {
            $('#removePVsBtn').on('click', removeSelectedPVs);
        });
    </script>
</div>

<script type="text/javascript" src="archViewer.js"></script>

</body>
</html>
