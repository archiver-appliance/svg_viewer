events {}
http {
    server {
        listen 80;

        location /retrieval/ui/viewer/ {
            alias /usr/share/nginx/html/;
        }

        location /retrieval/ {
            proxy_pass ${PROXY_ENDPOINT}/;
        }

        location = /favicon.ico {
            log_not_found off;
            access_log off;
            return 204;
        }
    }
}
