services:
  svg-viewer:
    build: .
    ports:
      - "${LISTENING_PORT:-8080}:${LISTENING_PORT:-8080}"
    environment:
      LISTENING_PORT: "${LISTENING_PORT:-8080}"
      ARCHIVER_DATA_RETRIEVAL_URL: "${ARCHIVER_DATA_RETRIEVAL_URL:-http://localhost:17668/retrieval}"
    restart: unless-stopped
