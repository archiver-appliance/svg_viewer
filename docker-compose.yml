version: '3.8'

services:
  nginx:
    build: .
    ports:
      - "16000:80"
    environment:
      - PROXY_ENDPOINT=${PROXY_ENDPOINT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/retrieval/ui/viewer/archViewer.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s