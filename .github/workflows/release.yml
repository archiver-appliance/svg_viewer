name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  check-tag:
    name: Check tag
    runs-on: ubuntu-latest
    steps:
      - name: Check that tag follows semantic version
        run: |
          num='(0|[1-9][0-9]*)'
          id='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          re="^v${num}\.${num}\.${num}(-${id}(\.${id})*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$"
          if [[ ! "${GITHUB_REF_NAME}" =~ $re ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a semantic version (expected e.g. v2.0.0 or v2.0.0-beta1)"
            exit 1
          fi

  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    needs: check-tag
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: pre-commit
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build release archive
        run: |
          files=(archViewer.html archViewer.js fapaths.json viewerProxy.py css/ icons/ node_modules/ README.md)
          for f in "${files[@]}"; do
            if [[ ! -e "$f" ]]; then
              echo "::error::'$f' is missing; update the release archive file list"
              exit 1
            fi
          done
          zip -r "svg-viewer-${GITHUB_REF_NAME}.zip" "${files[@]}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_file="svg-viewer-${GITHUB_REF_NAME}.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Release already created (e.g. from the GitHub UI): attach the archive
            gh release upload "${GITHUB_REF_NAME}" "${zip_file}" --clobber
          else
            prerelease=()
            # A "-" before any "+build" metadata marks a semver pre-release
            version="${GITHUB_REF_NAME%%+*}"
            if [[ "${version}" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "${GITHUB_REF_NAME}" --generate-notes "${prerelease[@]}" "${zip_file}"
          fi
