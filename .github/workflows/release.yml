name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  check-tag:
    name: Check tag
    runs-on: ubuntu-latest
    steps:
      - name: Check that tag follows semantic version
        run: |
          num='(0|[1-9][0-9]*)'
          id='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          re="^v${num}\.${num}\.${num}(-${id}(\.${id})*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$"
          if [[ ! "${GITHUB_REF_NAME}" =~ $re ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a semantic version (expected e.g. v2.0.0 or v2.0.0-beta1)"
            exit 1
          fi

  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    needs: check-tag
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: pre-commit
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build release archive
        run: |
          zip -r "svg-viewer-${GITHUB_REF_NAME}.zip" archViewer.html archViewer.js viewerProxy.py lib/ README.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes "svg-viewer-${GITHUB_REF_NAME}.zip"
